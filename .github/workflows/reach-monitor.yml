name: Reach AI Monitor - Real Data Collection

on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 5'
  workflow_dispatch:

jobs:
  reach-monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Reach AI Monitor Tests
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python reach_monitor.py

      - name: Commit and push results
        run: |
          git config user.name "Reach Monitor Bot"
          git config user.email "monitor@reach.local"
          git add -A
          git commit -m "📊 Reach AI Monitor - $(date +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reach-monitor-results
          path: results/
          retention-days: 90
