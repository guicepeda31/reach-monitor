name: Reach AI Monitor - Real Data Collection

on:
  schedule:
    - cron: '0 10 * * 1'  # Segunda-feira às 10:00 UTC
  workflow_dispatch:      # Permite executar manualmente

permissions:
  contents: write         # ✅ FIX: Permissão para fazer commit e push

jobs:
  reach-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        uses: actions/checkout@v4.2.0

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4.2.0

      - name: Set up Python
        uses: actions/setup-python@v5    # ✅ FIX: Atualizado para v5 (Node.js 24 compatible)
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv

      - name: Run Reach AI Monitor Tests
        run: python reach_monitor.py

      - name: Commit and push results
        run: |
          git config user.name "Reach Monitor Bot"
          git config user.email "monitor@reach.co"

          # Criar diretório se não existir
          mkdir -p results/history

          # Adicionar e commitar
          git add results/
          git commit -m "Reach AI Monitor - $(date +'%Y-%m-%d %H:%M') UTC" || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: reach-monitor-results
          path: results/
          retention-days: 30

      - name: Post Run actions/checkout@v4
        uses: actions/checkout@v4.2.0

      - name: Complete job
        run: echo "Reach AI Monitor execution completed"
