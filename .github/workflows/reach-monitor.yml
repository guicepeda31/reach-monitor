name: Reach AI Monitor - Real Data Collection

on:
  schedule:
    - cron: '0 10 * * 1'     # Segunda-feira às 10:00 UTC
    - cron: '0 10 * * 5'     # Sexta-feira às 10:00 UTC
  workflow_dispatch:          # Permite executar manualmente

permissions:
  contents: write             # Permissão para fazer commit e push

jobs:
  reach-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv

      - name: Run Reach AI Monitor Tests
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          mkdir -p results/history
          python reach_monitor.py

      - name: Commit and push results
        run: |
          git config user.name "Reach Monitor Bot"
          git config user.email "monitor@reach.local"
          
          git add results/
          git commit -m "Reach AI Monitor - $(date +'%Y-%m-%d %H:%M') UTC" || echo "No changes to commit"
          git push origin main || echo "Push failed - no changes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: reach-monitor-results-${{ github.run_id }}
          path: results/
          retention-days: 30
        if: always()

      - name: Job Summary
        run: |
          echo "## ✅ Reach AI Monitor Execution" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** Success" >> $GITHUB_STEP_SUMMARY
          if [ -f results/report_*.json ]; then
            echo "**Results:** Saved to artifacts" >> $GITHUB_STEP_SUMMARY
          fi
